name: Deploy AevShare URL Upload Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/aevshare-url-upload/**"
      - "supabase/functions/aevshare-web-archive/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-aevshare-url-upload.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy URL upload function
        run: supabase functions deploy aevshare-url-upload --project-ref "$SUPABASE_PROJECT_ID" --use-api --yes
      - name: Deploy web archive function
        run: supabase functions deploy aevshare-web-archive --project-ref "$SUPABASE_PROJECT_ID" --use-api --yes
