<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><meta name="description" content="AevStudio project setup"><title>プロジェクトを作成・再開 | AevStudio"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.create-shell{width:min(980px,calc(100% - 32px));margin:42px auto 80px}.create-head{margin-bottom:26px}.create-head h1{font-size:clamp(27px,5vw,42px);margin:8px 0}.create-head p{color:var(--muted)}.step-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,28px);margin:18px 0}.choice-grid,.template-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}.choice-card,.template-card{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:#111a2b;color:var(--text);padding:20px;cursor:pointer;transition:.18s}.choice-card:hover,.template-card:hover,.choice-card.selected,.template-card.selected{border-color:var(--accent,#8b6cff);background:#8b6cff18;transform:translateY(-1px)}.choice-card .symbol{font-size:28px}.choice-card strong,.choice-card small,.template-card strong,.template-card small{display:block}.choice-card strong{font-size:18px;margin:10px 0 6px}.choice-card small,.template-card small{color:var(--muted);line-height:1.6}.template-card strong{margin:8px 0 5px}.template-card .template-symbol{height:66px;border-radius:10px;background:linear-gradient(135deg,#222d4a,#6749a7);display:grid;place-items:center;font-size:22px;font-weight:800;letter-spacing:2px}.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}.field-grid label{display:grid;gap:7px;color:var(--muted);font-size:13px}.field-grid input,.field-grid select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0b1220;color:var(--text)}.wizard-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}.project-list{display:grid;gap:10px;margin-top:16px}.project-option{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:#111a2b;color:var(--text);cursor:pointer}.project-option.selected{border-color:#8b6cff;background:#8b6cff18}.project-option span{display:block}.project-option small{display:block;color:var(--muted);margin-top:4px}.project-empty,.wizard-status{padding:14px;border-radius:10px;background:#0d1627;color:var(--muted);line-height:1.6}.wizard-status.error{color:#ff9baf}.hidden-step{display:none!important}.step-kicker{font-size:12px;letter-spacing:1.5px;color:#a99aff;font-weight:800}.wizard-back{color:var(--muted);text-decoration:none}.wizard-back:hover{color:var(--text)}@media(max-width:600px){.create-shell{margin-top:24px}.wizard-actions>*{flex:1}.project-option{align-items:flex-start}}

/* Critical standalone rendering: keep the wizard visible even if shared CSS conflicts. */

body[data-page="create-project"] .topbar{display:flex!important;visibility:visible!important;opacity:1!important;min-height:68px;align-items:center;justify-content:space-between;padding:12px 20px;background:#090d18;border-bottom:1px solid #263149}

body[data-page="create-project"] .brand small{display:block;color:#929db7;font-size:9px}
body[data-page="create-project"] .brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#9d80ff,#5a4bc1)}
body[data-page="create-project"] main.create-shell{display:block!important;visibility:visible!important;opacity:1!important;position:relative!important;width:min(980px,calc(100% - 32px));margin:32px auto 80px;color:#edf1ff!important}
body[data-page="create-project"] .create-head,body[data-page="create-project"] #step-choice{display:block!important;visibility:visible!important;opacity:1!important}

body[data-page="create-project"] .create-head p{color:#aab5cc!important}
body[data-page="create-project"] .step-panel{display:block!important;visibility:visible!important;opacity:1!important;background:#111827!important;color:#edf1ff!important;border:1px solid #35415d;border-radius:16px;padding:22px;margin:18px 0}
body[data-page="create-project"] #step-new.hidden-step,body[data-page="create-project"] #step-continue.hidden-step{display:none!important}

body[data-page="create-project"] .choice-card{display:block!important;visibility:visible!important;opacity:1!important;min-height:130px;width:100%;padding:20px;text-align:left;background:#182238!important;color:#edf1ff!important;border:1px solid #35415d;border-radius:12px}

body[data-page="create-project"] .btn{display:inline-flex!important;align-items:center;justify-content:center;padding:11px 16px;border:1px solid #35415d;border-radius:9px;background:#172238;color:#edf1ff!important;text-decoration:none}
@media(max-width:600px){body[data-page="create-project"] main.create-shell{margin-top:20px}body[data-page="create-project"] .topbar{padding:10px 14px}}
body[data-page="create-project"]{padding-bottom:30px}#create-page-menu{position:fixed;z-index:9999;top:76px;right:16px;width:min(300px,calc(100vw - 32px));padding:12px;background:#111827;border:1px solid #35415d;border-radius:14px;box-shadow:0 18px 50px #000b}#create-page-menu:not([hidden]){display:grid;gap:7px}#create-page-menu a{display:block;padding:12px;border-radius:8px;color:#edf1ff;text-decoration:none;background:#1a263d}#create-page-menu a:focus,#create-page-menu a:hover{background:#2a3655}@media(max-width:600px){#create-page-menu{top:68px;right:10px}}</style></head><body data-page="create-project">
<header class="topbar"><a class="brand" href="./"><span class="brand-mark">A</span><span>AevStudio<small>WEB CREATION STUDIO</small></span></a><button class="btn btn-ghost" id="create-menu-toggle" type="button" aria-expanded="false" aria-controls="create-page-menu">☰ メニュー</button><a class="btn btn-ghost" href="projects.html">プロジェクト一覧</a></header><nav id="create-page-menu" aria-label="ページメニュー" hidden><a href="./">ホーム</a><a href="projects.html">プロジェクト一覧</a><a href="learn.html">Web制作を学ぶ</a><a href="code-library.html">応用コード一覧</a><a href="account.html">アカウント管理</a></nav>
<main class="create-shell">
<div class="create-head"><span class="eyebrow">PROJECT WORKFLOW</span><h1>プロジェクトを開始</h1><p>新しく制作するか、保存済みのプロジェクトの続きを始めます。</p></div>
<section class="step-panel" id="step-choice"><span class="step-kicker">STEP 01</span><h2>どちらを行いますか？</h2><div class="choice-grid">
<button class="choice-card" type="button" data-mode="new"><span class="symbol">＋</span><strong>新しいプロジェクト</strong><small>テンプレートやページ数などを決めて、新しく制作を始めます。</small></button>
<button class="choice-card" type="button" data-mode="continue"><span class="symbol">↗</span><strong>続きから</strong><small>端末またはクラウドに保存されたプロジェクトを再開します。</small></button>
</div><div class="wizard-actions"><a class="btn btn-ghost" href="projects.html">キャンセル</a></div></section>
<section class="step-panel hidden-step" id="step-new"><span class="step-kicker">STEP 02 · NEW PROJECT</span><h2>制作内容を設定</h2><p class="muted">テンプレートを選び、プロジェクトの基本情報を入力してください。</p>
<div class="template-grid" id="template-options">
<button type="button" class="template-card selected" data-template-choice="blank"><span class="template-symbol">BLANK</span><strong>空白のWebサイト</strong><small>自由に構成を作成</small></button>
<button type="button" class="template-card" data-template-choice="portfolio"><span class="template-symbol">WORKS</span><strong>ポートフォリオ</strong><small>作品・プロフィール紹介</small></button>
<button type="button" class="template-card" data-template-choice="landing"><span class="template-symbol">LAUNCH</span><strong>サービス紹介・LP</strong><small>サービスや商品の紹介</small></button>
<button type="button" class="template-card" data-template-choice="blog"><span class="template-symbol">JOURNAL</span><strong>ブログ・メディア</strong><small>記事やお知らせの発信</small></button>
<button type="button" class="template-card" data-template-choice="shop"><span class="template-symbol">STORE</span><strong>オンラインショップ</strong><small>商品を紹介するサイト</small></button>
<button type="button" class="template-card" data-template-choice="restaurant"><span class="template-symbol">CAFE</span><strong>レストラン・カフェ</strong><small>店舗情報・メニュー紹介</small></button>
<button type="button" class="template-card" data-template-choice="event"><span class="template-symbol">EVENT</span><strong>イベント・告知</strong><small>開催情報や参加案内</small></button>
<button type="button" class="template-card" data-template-choice="photography"><span class="template-symbol">PHOTO</span><strong>写真・ギャラリー</strong><small>写真作品の展示</small></button>
<button type="button" class="template-card" data-template-choice="gaming"><span class="template-symbol">GAMING</span><strong>ゲーム・コミュニティ</strong><small>ゲームやファンサイト</small></button>
<button type="button" class="template-card" data-template-choice="agency"><span class="template-symbol">STUDIO</span><strong>制作会社・ビジネス</strong><small>事業・サービス情報</small></button>
</div>
<div class="field-grid" style="margin-top:20px"><label>プロジェクト名<input id="new-project-name" maxlength="80" placeholder="例：ポートフォリオサイト"></label><label>ページ数<select id="new-project-pages"><option value="1">1ページ</option><option value="2" selected>2ページ</option><option value="3">3ページ</option><option value="4">4ページ</option><option value="5">5ページ</option><option value="6">6ページ</option><option value="7">7ページ</option><option value="8">8ページ</option><option value="9">9ページ</option><option value="10">10ページ</option></select></label></div>
<div class="wizard-status" id="new-status" role="status">設定が完了したら「プロジェクトを作成」を押してください。</div><div class="wizard-actions"><button class="btn btn-ghost" id="new-back" type="button">戻る</button><button class="btn btn-primary" id="create-project-button" type="button">プロジェクトを作成 →</button></div></section>
<section class="step-panel hidden-step" id="step-continue"><span class="step-kicker">STEP 02 · CONTINUE</span><h2>続きから制作</h2><p class="muted">端末に保存されたプロジェクトと、ログイン中のアカウントのクラウドデータを確認します。</p><div class="wizard-status" id="continue-status" role="status">プロジェクトを読み込んでいます...</div><div class="project-list" id="continue-project-list"></div><div class="wizard-actions"><button class="btn btn-ghost" id="continue-back" type="button">戻る</button><button class="btn btn-primary" id="open-project-button" type="button" disabled>選択したプロジェクトを開く →</button></div></section>
</main>
<script>document.addEventListener("DOMContentLoaded",function(){const b=document.getElementById("create-menu-toggle"),m=document.getElementById("create-page-menu");if(!b||!m)return;b.addEventListener("click",function(){const open=m.hasAttribute("hidden");if(open)m.removeAttribute("hidden");else m.setAttribute("hidden","");b.setAttribute("aria-expanded",String(open));});document.addEventListener("click",function(e){if(!m.contains(e.target)&&!b.contains(e.target)){m.setAttribute("hidden","");b.setAttribute("aria-expanded","false");}});});</script><script defer src="config.js"></script><script defer src="auth.js?v=20261121-13"></script><script defer src="create-project.js?v=20261121-4"></script></body></html>
